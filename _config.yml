# Site settings
title: "Java Interview Q&A"
description: "Comprehensive Java backend interview questions and answers — built with Jekyll + GitHub Pages."
baseurl: "/java-interview-qa" # Must match repository name for GitHub Pages project site
url: "https://x-wuxl.github.io"

author: "wuxl"

# SEO Keywords
keywords: "Java面试, Java后端, 面试题, Spring框架, JVM, 并发编程, 集合框架, 数据库, 分布式系统, 设计模式, 算法, Java基础, 中间件, Redis, MySQL, MyBatis, Spring Boot, 多线程"

# Language
lang: zh-CN

# Social
social:
  name: wuxl
  links:
    - https://github.com/x-wuxl

# Theme - Just the Docs
remote_theme: just-the-docs/just-the-docs@v0.8.0
markdown: kramdown
highlighter: rouge

# Just the Docs 主题配置
# 启用搜索功能
search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false

# 导航设置
nav_sort: case_insensitive

# 启用面包屑导航
breadcrumb_nav_enabled: true

# 启用回到顶部按钮
back_to_top: true
back_to_top_text: "回到顶部"

# 页脚内容
footer_content: "Copyright &copy; 2025 wuxl. 本站内容遵循学习路径递进逻辑，共613道Java后端面试题。"

# 代码高亮主题
color_scheme: light

# Aux links (右上角链接)
aux_links:
  "GitHub 仓库":
    - "https://github.com/x-wuxl/java-interview-qa"

# 设置外部链接在新标签页打开
aux_links_new_tab: true

# Plugins (these work natively on GitHub Pages)
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-remote-theme  # Required for remote_theme to work on GitHub Pages

# Google Analytics
google_analytics_id: G-FX2D2XS2QM

