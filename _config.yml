# Site settings
title: "Java Interview Q&A"
description: "Comprehensive Java backend interview questions and answers — built with Jekyll + GitHub Pages."
baseurl: "/java-interview-qa"
url: "https://x-wuxl.github.io"

author: "wuxl"

# Language
lang: zh-CN

# Theme - Just the Docs (最简配置)
remote_theme: just-the-docs/just-the-docs

# 启用搜索
search_enabled: true

# 启用面包屑导航
breadcrumb_nav_enabled: true

# 启用回到顶部
back_to_top: true
back_to_top_text: "回到顶部"

# 页脚
footer_content: "Copyright &copy; 2025 wuxl. Java 后端面试题库，共613道题目"

# Aux links
aux_links:
  "GitHub":
    - "https://github.com/x-wuxl/java-interview-qa"

# Plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-remote-theme

# Google Analytics
google_analytics_id: G-FX2D2XS2QM

# Build settings
markdown: kramdown
highlighter: rouge

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - scripts/
  - _data/学习路径排序_优化版.md
  - 新增题目操作指南.md
  - NAVIGATION_FIX.md
  - _posts/
